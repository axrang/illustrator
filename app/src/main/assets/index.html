<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#23252b">
<title>Vector Studio</title>
<style>:root{--bg:#15161a;--panel:#23252b;--panel2:#2e3138;--line:#3b3e46;--tx:#eceef1;--mut:#9aa1ab;--acc:#4c8dff;--acc2:#ff7a1a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.45 system-ui,"Vazirmatn",Tahoma,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
#top{display:flex;align-items:center;gap:4px;padding:max(4px,env(safe-area-inset-top)) 6px 4px;background:var(--panel);border-bottom:1px solid var(--line);direction:ltr}
#top .ttl{flex:1;font-weight:700;letter-spacing:.3px;padding:0 6px;color:var(--mut);font-size:12px}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:0 10px;min-height:38px;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(1.3)}
button:disabled{opacity:.35}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ib{width:40px;padding:0;display:grid;place-items:center}
#zFit{min-width:56px;padding:0 6px}
#stage{flex:1;position:relative;min-height:90px;background:#5b5f67;touch-action:none;overflow:hidden;direction:ltr}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ctx{display:flex;gap:6px;overflow-x:auto;padding:5px 6px;background:var(--panel);border-top:1px solid var(--line);scrollbar-width:none;flex:0 0 auto}
#ctx::-webkit-scrollbar,#tools::-webkit-scrollbar,#tabs::-webkit-scrollbar{display:none}
.cb{flex:0 0 auto;min-height:34px;font-size:12px;white-space:nowrap}
.cb.big{min-height:44px;font-size:13px;flex:1 1 140px}
.cb.pri{background:#2a4a85;border-color:var(--acc)}
#tools{display:flex;overflow-x:auto;background:var(--panel);border-top:1px solid var(--line);direction:ltr;flex:0 0 auto;scrollbar-width:none}
.tool{flex:0 0 auto;width:58px;height:52px;border:0;border-radius:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;color:#c5cad1}
.tool span{font-size:9.5px;white-space:nowrap}
.tool.on{background:var(--acc);color:#fff}
#tabs{display:flex;background:#1b1c20;border-top:1px solid var(--line);flex:0 0 auto}
.tab{flex:1;border:0;border-radius:0;background:transparent;min-height:40px;color:var(--mut);padding:0 2px;font-size:12.5px}
.tab.on{color:#fff;border-bottom:2px solid var(--acc);background:var(--panel)}
#panel{height:0;overflow:hidden auto;background:var(--panel);flex:0 0 auto;padding:0 10px;transition:height .15s}
#panel.open{height:36vh;padding:8px 10px 14px}
h4{margin:12px 0 6px;font-size:12px;color:var(--mut);font-weight:600}
.prow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.lb{color:var(--mut);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:34px;font-size:12px;padding:0 9px}
.nf{display:flex;flex-direction:column;gap:2px;flex:1 1 70px;min-width:64px}
.nf.wide{flex:1 1 100%}
.nf span,.rf span{font-size:11px;color:var(--mut)}
input[type=number],input[type=text],textarea,select{background:#17181c;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font:inherit;width:100%;-webkit-user-select:text;user-select:text}
.rf{display:grid;grid-template-columns:1fr 44px;grid-template-areas:"l o" "r r";gap:0 6px;flex:1 1 150px;align-items:center}
.rf span{grid-area:l}.rf output{grid-area:o;text-align:end;font-size:12px;color:var(--tx)}.rf input{grid-area:r;width:100%}
input[type=range]{accent-color:var(--acc);height:28px}
.chk{display:flex;gap:6px;align-items:center;font-size:12.5px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.swt{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 10px 0 8px}
.swt i{width:24px;height:24px;border-radius:6px;border:2px solid #fff6;display:block;background:#000}
.swt i.none{background:linear-gradient(135deg,transparent 45%,#e33 45%,#e33 55%,transparent 55%),#fff}
.swt.on{outline:2px solid var(--acc)}
.swt span{font-size:12px}
.sws{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sw{width:30px;height:30px;border-radius:7px;padding:0;min-height:0;border:1px solid #fff4}
#pk{display:flex;flex-direction:column;gap:8px;margin:6px 0}
#pkcv{width:100%;height:105px;border-radius:10px;touch-action:none}
#pk input[type=text],#pkhex{background:#17181c;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit;width:100%;-webkit-user-select:text}
#pkh{width:100%;-webkit-appearance:none;appearance:none;height:16px;border-radius:8px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#pkh::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #000}
.list{display:flex;flex-direction:column;gap:4px}
.li,.oi{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px 6px;min-height:40px}
.li button{background:transparent;border:0;min-height:34px;padding:0 6px;font-size:16px}
.li.cur{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.oi.on{background:#264a8a;border-color:var(--acc)}
.nm{flex:1}.cnt{color:var(--mut);font-size:11px}
.hint{color:var(--mut);font-size:12px;line-height:1.7;margin:10px 2px}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.show{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px}
.mbox h3{margin:0;font-size:15px}
.mrow{display:flex;gap:8px;justify-content:flex-end}
.mrow .pri{background:var(--acc);border-color:var(--acc);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(30vh + 70px);transform:translateX(-50%) translateY(20px);background:#000d;color:#fff;padding:9px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.2s;z-index:60;font-size:13px;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.filebtn{display:grid;place-items:center;padding:0 10px}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="bUndo" class="ib" aria-label="Undo"></button>
    <button id="bRedo" class="ib" aria-label="Redo"></button>
    <span class="ttl">VECTOR STUDIO</span>
    <button id="bGrid" class="ib" aria-label="Grid"></button>
    <button id="zOut" class="ib">−</button>
    <button id="zFit">100%</button>
    <button id="zIn" class="ib">+</button>
  </header>
  <div id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <defs><pattern id="gridpat" patternUnits="userSpaceOnUse" width="20" height="20"><path id="gridpath" d="M20 0H0V20" fill="none" stroke="rgba(0,0,0,.18)"/></pattern></defs>
      <g id="world">
        <rect id="shadow" x="4" y="6" fill="rgba(0,0,0,.35)"/>
        <rect id="board" x="0" y="0" fill="#fff"/>
        <rect id="gridrect" x="0" y="0" fill="url(#gridpat)" style="display:none;pointer-events:none"/>
        <g id="content"></g>
      </g>
      <g id="ovl" style="pointer-events:none"></g>
    </svg>
  </div>
  <div id="ctx"></div>
  <nav id="tools"></nav>
  <nav id="tabs"></nav>
  <section id="panel"></section>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script>'use strict';
/* ===== Vector Studio – core: data model, geometry, history ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const N = n => (+(+n).toFixed(3)).toString();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const KAPPA = 0.5522847498;
const FONTS = { sans: 'Arial, Helvetica, Tahoma, sans-serif', serif: '"Times New Roman", Times, serif', mono: '"Courier New", Courier, monospace' };

function newDoc(w = 1080, h = 1080) {
  return { w, h, bg: '#ffffff', grid: 20, uid: 1, layers: [{ id: 'l1', name: 'لایه ۱', visible: true, locked: false, objs: [] }] };
}
let doc = newDoc();
const nid = () => 'o' + (doc.uid++);

const S = {
  tool: 'select', sel: [], anchors: new Set(), cur: 0,
  view: { x: 0, y: 0, s: 1 },
  style: { fill: '#4c8dff', grad: null, stroke: '#16181d', sw: 3, cap: 'round', join: 'round', dash: 'none', op: 1, rule: 'nonzero' },
  target: 'fill', snap: false, showGrid: false, constrain: false, multi: false, lockRatio: true,
  opt: { radius: 0, sides: 6, points: 5, inner: 0.5, font: 'sans', size: 56, bold: false, italic: false },
  pen: null, draft: null, act: null, clip: null, panel: null, recent: []
};

/* ---- points / paths ---- */
const P = (x, y, s = false) => ({ x, y, ix: x, iy: y, ox: x, oy: y, s });
const hasH = p => p.ix !== p.x || p.iy !== p.y || p.ox !== p.x || p.oy !== p.y;

function pathD(sub) {
  const p = sub.pts, n = p.length;
  if (!n) return '';
  const seg = (a, b) => (a.ox === a.x && a.oy === a.y && b.ix === b.x && b.iy === b.y)
    ? `L${N(b.x)} ${N(b.y)}` : `C${N(a.ox)} ${N(a.oy)} ${N(b.ix)} ${N(b.iy)} ${N(b.x)} ${N(b.y)}`;
  let d = `M${N(p[0].x)} ${N(p[0].y)}`;
  for (let i = 1; i < n; i++) d += seg(p[i - 1], p[i]);
  if (sub.closed && n > 1) d += seg(p[n - 1], p[0]) + 'Z';
  return d;
}
function bez(a, b, t) {
  const u = 1 - t;
  return [u * u * u * a.x + 3 * u * u * t * a.ox + 3 * u * t * t * b.ix + t * t * t * b.x,
          u * u * u * a.y + 3 * u * u * t * a.oy + 3 * u * t * t * b.iy + t * t * t * b.y];
}
function flat(sub, n = 16) {
  const p = sub.pts, out = [];
  if (p.length === 1) return [[p[0].x, p[0].y]];
  const segs = sub.closed ? p.length : p.length - 1;
  for (let i = 0; i < segs; i++) {
    const a = p[i], b = p[(i + 1) % p.length];
    for (let k = i === 0 ? 0 : 1; k <= n; k++) out.push(bez(a, b, k / n));
  }
  return out;
}

/* ---- affine matrices ---- */
const M = (a = 1, b = 0, c = 0, d = 1, e = 0, f = 0) => ({ a, b, c, d, e, f });
const ap = (m, x, y) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f];
const compose = (m, n) => M(m.a * n.a + m.c * n.b, m.b * n.a + m.d * n.b, m.a * n.c + m.c * n.d, m.b * n.c + m.d * n.d,
  m.a * n.e + m.c * n.f + m.e, m.b * n.e + m.d * n.f + m.f);
const mTrans = (dx, dy) => M(1, 0, 0, 1, dx, dy);
const mScaleAt = (sx, sy, cx, cy) => M(sx, 0, 0, sy, cx * (1 - sx), cy * (1 - sy));
const mRotAt = (deg, cx, cy) => {
  const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  return M(c, s, -s, c, cx - c * cx + s * cy, cy - s * cx - c * cy);
};
function mapObj(o, m) {
  if (o.type === 'group') { o.children.forEach(c => mapObj(c, m)); return; }
  if (o.type === 'text') {
    const [nx, ny] = ap(m, o.x, o.y); o.x = nx; o.y = ny;
    o.size *= Math.sqrt(Math.abs(m.a * m.d - m.b * m.c)) || 1;
    o.rot = (o.rot || 0) + Math.atan2(m.b, m.a) * 180 / Math.PI;
    return;
  }
  o.sub.forEach(s => s.pts.forEach(p => {
    [p.x, p.y] = ap(m, p.x, p.y); [p.ix, p.iy] = ap(m, p.ix, p.iy); [p.ox, p.oy] = ap(m, p.ox, p.oy);
  }));
}

/* ---- text metrics ---- */
const mctx = document.createElement('canvas').getContext('2d');
const fontStr = (o, size) => `${o.italic ? 'italic ' : ''}${o.bold ? 'bold ' : ''}${size || o.size}px ${FONTS[o.font] || FONTS.sans}`;
function textLines(o) { return String(o.text).split('\n'); }
function textBox(o) {
  mctx.font = fontStr(o);
  const lines = textLines(o);
  const w = Math.max(1, ...lines.map(l => mctx.measureText(l).width));
  const h = lines.length * 1.2 * o.size, top = o.y - o.size * 0.95;
  const m = mRotAt(o.rot || 0, o.x, o.y);
  const pts = [[o.x, top], [o.x + w, top], [o.x + w, top + h], [o.x, top + h]].map(p => ap(m, p[0], p[1]));
  return [Math.min(...pts.map(p => p[0])), Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[0])), Math.max(...pts.map(p => p[1]))];
}
function bbox(o) {
  if (o.type === 'group') return unionBox(o.children.map(bbox));
  if (o.type === 'text') return textBox(o);
  let b = null;
  o.sub.forEach(s => flat(s).forEach(([x, y]) => {
    if (!b) b = [x, y, x, y]; else { b[0] = Math.min(b[0], x); b[1] = Math.min(b[1], y); b[2] = Math.max(b[2], x); b[3] = Math.max(b[3], y); }
  }));
  return b || [0, 0, 0, 0];
}
function unionBox(list) {
  list = list.filter(Boolean);
  if (!list.length) return null;
  return [Math.min(...list.map(b => b[0])), Math.min(...list.map(b => b[1])), Math.max(...list.map(b => b[2])), Math.max(...list.map(b => b[3]))];
}

/* ---- document lookups ---- */
function findObj(id) {
  for (let li = 0; li < doc.layers.length; li++) {
    const arr = doc.layers[li].objs, idx = arr.findIndex(o => o.id === id);
    if (idx >= 0) return { o: arr[idx], arr, idx, li };
  }
  return null;
}
const selObjs = () => S.sel.map(id => findObj(id)).filter(Boolean).map(r => r.o);
const selBox = () => unionBox(selObjs().map(bbox));
function cloneObj(o) {
  const c = clone(o); c.id = nid();
  if (c.type === 'group') c.children = c.children.map(ch => { const k = cloneObj(ch); return k; });
  return c;
}

/* ---- history ---- */
let hist = [], hi = -1;
function commit() {
  hist = hist.slice(0, hi + 1); hist.push(JSON.stringify(doc));
  if (hist.length > 80) hist.shift();
  hi = hist.length - 1; autosave(); uiRefresh();
}
function restore(str) {
  doc = JSON.parse(str);
  S.sel = S.sel.filter(id => findObj(id));
  S.anchors.clear();
  S.cur = clamp(S.cur, 0, doc.layers.length - 1);
  render(); uiRefresh(true);
}
const undo = () => { if (hi > 0) { hi--; restore(hist[hi]); autosave(); } };
const redo = () => { if (hi < hist.length - 1) { hi++; restore(hist[hi]); autosave(); } };
function autosave() { try { localStorage.setItem('vs_doc', JSON.stringify(doc)); } catch (e) { } }
function autoload() {
  try { const s = localStorage.getItem('vs_doc'); if (s) { const d = JSON.parse(s); if (d && d.layers) doc = d; } } catch (e) { }
}

/* ---- color helpers ---- */
function hex2rgb(h) { h = (h || '#000').replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const rgb2hex = (r, g, b) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
function rgb2hsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let h = 0;
  if (d) { if (mx === r) h = ((g - b) / d) % 6; else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
  return [h, mx ? d / mx : 0, mx];
}
function hsv2rgb(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c; let r = 0, g = 0, b = 0;
  if (h < 60) [r, g, b] = [c, x, 0]; else if (h < 120) [r, g, b] = [x, c, 0]; else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c]; else if (h < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}

/* ===== rendering, overlay, hit-testing ===== */
const stage = () => $('#stage');
const toW = (sx, sy) => ({ x: (sx - S.view.x) / S.view.s, y: (sy - S.view.y) / S.view.s });
const toS = (x, y) => [x * S.view.s + S.view.x, y * S.view.s + S.view.y];
const sn = v => S.snap ? Math.round(v / doc.grid) * doc.grid : v;
const snapPt = p => ({ x: sn(p.x), y: sn(p.y) });

function dashArr(o) {
  const w = Math.max(o.sw || 1, 1);
  if (o.dash === 'dash') return [w * 3, w * 2];
  if (o.dash === 'dot') return [0.01, w * 2];
  return null;
}

function objSvg(o, opt) {
  opt = opt || {};
  const id = opt.ids ? ` data-id="${o.id}"` : '';
  const op = o.op != null && o.op < 1 ? ` opacity="${N(o.op)}"` : '';
  if (o.type === 'group') return `<g${id}${op}>${o.children.map(c => objSvg(c, {})).join('')}</g>`;
  let defs = '', fill = 'none';
  if (o.grad) {
    const b = bbox(o), cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2, a = o.grad.a * Math.PI / 180;
    const half = (Math.abs((b[2] - b[0]) * Math.cos(a)) + Math.abs((b[3] - b[1]) * Math.sin(a))) / 2 || 1;
    defs = `<linearGradient id="g_${o.id}" gradientUnits="userSpaceOnUse" x1="${N(cx - Math.cos(a) * half)}" y1="${N(cy - Math.sin(a) * half)}" x2="${N(cx + Math.cos(a) * half)}" y2="${N(cy + Math.sin(a) * half)}"><stop offset="0" stop-color="${o.grad.c1}"/><stop offset="1" stop-color="${o.grad.c2}"/></linearGradient>`;
    fill = `url(#g_${o.id})`;
  } else if (o.fill) fill = o.fill;
  let stroke = '';
  if (o.stroke && o.sw > 0) {
    stroke = ` stroke="${o.stroke}" stroke-width="${N(o.sw)}" stroke-linecap="${o.cap || 'butt'}" stroke-linejoin="${o.join || 'miter'}"`;
    const d = dashArr(o); if (d) stroke += ` stroke-dasharray="${d.map(N).join(' ')}"`;
  }
  if (o.type === 'text') {
    const rot = o.rot ? ` transform="rotate(${N(o.rot)} ${N(o.x)} ${N(o.y)})"` : '';
    const lines = textLines(o).map((l, i) => `<tspan x="${N(o.x)}" dy="${i ? N(o.size * 1.2) : 0}">${esc(l) || ' '}</tspan>`).join('');
    return `<g${id}${op}>${defs}<text x="${N(o.x)}" y="${N(o.y)}" font-family="${esc(FONTS[o.font] || FONTS.sans)}" font-size="${N(o.size)}"${o.bold ? ' font-weight="bold"' : ''}${o.italic ? ' font-style="italic"' : ''} fill="${fill}"${stroke}${rot} xml:space="preserve">${lines}</text></g>`;
  }
  const d = o.sub.map(pathD).join('');
  return `<g${id}${op}>${defs}<path d="${d}" fill="${fill}"${o.rule === 'evenodd' ? ' fill-rule="evenodd"' : ''}${stroke}/></g>`;
}

function docSvg(opts) {
  opts = opts || {};
  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${doc.w}" height="${doc.h}" viewBox="0 0 ${doc.w} ${doc.h}">`;
  if (opts.bg) s += `<rect width="${doc.w}" height="${doc.h}" fill="${doc.bg}"/>`;
  doc.layers.forEach((L, i) => {
    if (!L.visible) return;
    s += `<g id="Layer_${i + 1}" data-name="${esc(L.name)}">${L.objs.map(o => objSvg(o, {})).join('')}</g>`;
  });
  return s + '</svg>';
}

function draftObj() {
  if (S.draft) return S.draft;

        lines.forEach((l, i) => x.fillText(l, 4 * sc, 4 * sc + (o.size * 0.95 + i * 1.2 * o.size) * sc));
        const d = x.getImageData(0, 0, w, h).data, rgb = new Uint8Array(w * h * 3), al = new Uint8Array(w * h);
        for (let i = 0, j = 0; i < w * h; i++) { rgb[j++] = d[i * 4]; rgb[j++] = d[i * 4 + 1]; rgb[j++] = d[i * 4 + 2]; al[i] = d[i * 4 + 3]; }
        const sm = addStream(`/Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceGray/BitsPerComponent 8`, al);
        const im = addStream(`/Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/SMask ${sm} 0 R`, rgb);
        const key = 'Im' + (res.xo.length + 1); res.xo.push([key, im]);
        c += `1 0 0 1 ${N(o.x)} ${N(o.y)} cm\n`;
        if (o.rot) { const r = o.rot * Math.PI / 180; c += `${N(Math.cos(r))} ${N(Math.sin(r))} ${N(-Math.sin(r))} ${N(Math.cos(r))} 0 0 cm\n`; }
        c += `${N(w / sc)} 0 0 ${N(-h / sc)} ${N(-4)} ${N(-o.size * 0.95 - 4 + h / sc)} cm\n/${key} Do\n`;
      }
      return c + 'Q\n';
    }
    const hasFill = !!(o.fill || o.grad), hasStroke = o.stroke && o.sw > 0, ev = o.rule === 'evenodd';
    const geom = o.sub.map(pathOps).join('');
    if (o.grad) {
      const b = bbox(o), cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2, a = o.grad.a * Math.PI / 180;
      const half = (Math.abs((b[2] - b[0]) * Math.cos(a)) + Math.abs((b[3] - b[1]) * Math.sin(a))) / 2 || 1;
      const k = shKey(o.grad.c1, o.grad.c2, cx - Math.cos(a) * half, cy - Math.sin(a) * half, cx + Math.cos(a) * half, cy + Math.sin(a) * half);
      c += `q\n${geom}${ev ? 'W*' : 'W'} n\n/${k} sh\nQ\n`;
      if (hasStroke) c += strokeSetup(o) + geom + 'S\n';
    } else if (hasFill && hasStroke) c += `${rgbOps(o.fill)} rg\n` + strokeSetup(o) + geom + (ev ? 'B*' : 'B') + '\n';
    else if (hasFill) c += `${rgbOps(o.fill)} rg\n` + geom + (ev ? 'f*' : 'f') + '\n';
    else if (hasStroke) c += strokeSetup(o) + geom + 'S\n';
    else return '';
    return c + 'Q\n';
  };

  let content = `0.75 0 0 -0.75 0 ${N(ph)} cm\n`;
  if (S.expBg !== false) content += `q ${rgbOps(doc.bg)} rg 0 0 ${W} ${H} re f Q\n`;
  const ocgIds = [];
  doc.layers.forEach((L, i) => {
    if (!L.visible) return;
    const id = add(`<</Type/OCG/Name ${hexU16(L.name)}>>`), key = 'OC' + (i + 1); ocgIds.push(id); res.oc.push([key, id]);
    content += `/OC /${key} BDC\n` + L.objs.map(o => drawObj(o, 1)).join('') + 'EMC\n';
  });
  const cId = addStream('', str2u8(content));
  const date = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
  const info = add(`<</Title ${hexU16(S.fname || 'drawing')}/Creator(Vector Studio)/Producer(Vector Studio)/CreationDate(D:${date})>>`);
  objs[1] = `<</Type/Catalog/Pages 2 0 R/OCProperties<</OCGs[${ocgIds.map(i => i + ' 0 R').join(' ')}]/D<</Order[${ocgIds.map(i => i + ' 0 R').join(' ')}]/ON[${ocgIds.map(i => i + ' 0 R').join(' ')}]>>>>>>`;
  objs[2] = `<</Type/Pages/Kids[3 0 R]/Count 1>>`;
  const dict = (name, arr) => arr.length ? `/${name}<<${arr.map(([k, id]) => `/${k} ${id} 0 R`).join('')}>>` : '';
  objs[3] = `<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${N(pw)} ${N(ph)}]/Contents ${cId} 0 R/Resources<<${dict('Font', Object.values(res.font).map(f => [f.key, f.id]))}${dict('ExtGState', Object.entries(res.gs))}${dict('Shading', res.sh)}${dict('XObject', res.xo)}${dict('Properties', res.oc)}>>>>`;
  // serialise
  let out = '%PDF-1.5\n%\xE2\xE3\xCF\xD3\n'; const offs = [];
  const sByid = {}; streams.forEach(s => sByid[s.id] = s);
  for (let i = 1; i < objs.length; i++) {
    offs[i] = out.length;
    if (sByid[i]) {
      const s = sByid[i]; let data = s.u8, filt = ''; const z = await deflate(data); if (z && z.length < data.length) { data = z; filt = '/Filter/FlateDecode'; }
      out += `${i} 0 obj\n<<${s.dict}${filt}/Length ${data.length}>>\nstream\n${u82str(data)}\nendstream\nendobj\n`;
    } else out += `${i} 0 obj\n${objs[i]}\nendobj\n`;
  }
  const xr = out.length;
  out += `xref\n0 ${objs.length}\n0000000000 65535 f \n` + offs.slice(1).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
  out += `trailer\n<</Size ${objs.length}/Root 1 0 R/Info ${info} 0 R>>\nstartxref\n${xr}\n%%EOF\n`;
  return str2u8(out);
}

async function svgToPng(scale) {
  const svg = docSvg({ bg: S.expBg !== false }), url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  const img = new Image(); img.decoding = 'async';
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const cv = document.createElement('canvas'); cv.width = Math.round(doc.w * scale); cv.height = Math.round(doc.h * scale);
  const x = cv.getContext('2d'); x.drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png')); return new Uint8Array(await blob.arrayBuffer());
}

async function doExport(kind) {
  const base = S.fname || 'drawing';
  try {
    toast('در حال ساخت فایل…');
    if (kind === 'svg') saveBytes(base + '.svg', 'image/svg+xml', new TextEncoder().encode(docSvg({ bg: S.expBg !== false })));
    else if (kind === 'png') saveBytes(base + '.png', 'image/png', await svgToPng(Math.min(S.pngScale || 2, Math.floor(8000 / Math.max(doc.w, doc.h)) || 1)));
    else if (kind === 'pdf') saveBytes(base + '.pdf', 'application/pdf', await buildPDF());
    else if (kind === 'ai') saveBytes(base + '.ai', 'application/postscript', await buildPDF());
    else if (kind === 'json') saveBytes(base + '.vstudio.json', 'application/json', new TextEncoder().encode(JSON.stringify(doc)));
  } catch (e) { console.error(e); toast('خطا در ساخت فایل: ' + (e && e.message || e)); }
}

/* ---- init ---- */
function init() {
  autoload(); buildUI(); installPointer();
  hist = [JSON.stringify(doc)]; hi = 0;
  new ResizeObserver(() => { if (!S.fitted) { S.fitted = true; fitView(); } else render(); }).observe($('#stage'));
  fitView(); uiRefresh(true); uiZoom();
  document.addEventListener('pointerdown', e => { if (e.target.closest('#stage')) { const a = document.activeElement; if (a && a.blur && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) a.blur(); } }, true);
  document.addEventListener('contextmenu', e => e.preventDefault());
  window.__vs = { S, get doc() { return doc; }, buildPDF, docSvg, setTool, commit, render, fitView, toW, toS };
}
window.addEventListener('DOMContentLoaded', init);

</script>
