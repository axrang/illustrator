<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#23252b">
<title>Vector Studio</title>
<style>/*CSS*/</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="bUndo" class="ib" aria-label="Undo"></button>
    <button id="bRedo" class="ib" aria-label="Redo"></button>
    <span class="ttl">VECTOR STUDIO</span>
    <button id="bGrid" class="ib" aria-label="Grid"></button>
    <button id="zOut" class="ib">−</button>
    <button id="zFit">100%</button>
    <button id="zIn" class="ib">+</button>
  </header>
  <div id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <defs><pattern id="gridpat" patternUnits="userSpaceOnUse" width="20" height="20"><path id="gridpath" d="M20 0H0V20" fill="none" stroke="rgba(0,0,0,.18)"/></pattern></defs>
      <g id="world">
        <rect id="shadow" x="4" y="6" fill="rgba(0,0,0,.35)"/>
        <rect id="board" x="0" y="0" fill="#fff"/>
        <rect id="gridrect" x="0" y="0" fill="url(#gridpat)" style="display:none;pointer-events:none"/>
        <g id="content"></g>
      </g>
      <g id="ovl" style="pointer-events:none"></g>
    </svg>
  </div>
  <div id="ctx"></div>
  <nav id="tools"></nav>
  <nav id="tabs"></nav>
  <section id="panel"></section>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script>/*JS*/</script>
</body>
</html>
